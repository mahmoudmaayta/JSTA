# Nixpacks configuration for JSTA Tourism Portal
# This ensures proper build and deployment on Coolify

[phases.setup]
nixPkgs = ['nodejs_20', 'pnpm']

[phases.install]
cmds = [
  'corepack enable',
  'corepack prepare pnpm@latest --activate',
  'pnpm install --frozen-lockfile'
]

[phases.build]
cmds = ['pnpm run build']

# Install only runtime dependencies needed for bundled app
[phases.postBuild]
cmds = [
  'pnpm install --prod --frozen-lockfile',
  'pnpm add pg @neondatabase/serverless drizzle-kit'
]

[start]
cmd = 'pnpm run db:push && node dist/index.js'

[variables]
NODE_ENV = 'production'
