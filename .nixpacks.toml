# Nixpacks configuration for JSTA Tourism Portal
# Keep node_modules for runtime since we use --external for packages

[phases.setup]
nixPkgs = ['nodejs_20', 'pnpm']

[phases.install]
cmds = [
  'corepack enable',
  'corepack prepare pnpm@latest --activate',
  'pnpm install --frozen-lockfile'
]

[phases.build]
cmds = ['pnpm run build']

[start]
cmd = 'pnpm run db:push && node dist/index.js'

[variables]
NODE_ENV = 'production'
